
spring.application.name=ventrya-api

# Oracle FIAP
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Servidor
server.port=8080

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.table=flyway_ventrya_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Seguranca / JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Ventrya IA - Ollama local
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b
spring.ai.ollama.chat.num-predict=150
spring.ai.ollama.chat.keep-alive=10m
spring.ai.ollama.chat.temperature=0.2

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:ventrya}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Logs
logging.level.org.springframework.security=DEBUG
